name: self-check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check standard-library dependencies
        run: python -c "import sqlite3, ast, json, threading; print('stdlib ok', sqlite3.sqlite_version)"
      - name: Run workspace self-check
        run: python tools/verify_all.py --verbose
      - name: Run MCP self-test
        run: python tools/mcp_server.py --selftest
      - name: Compile Python files
        run: python -m compileall -q tools tests

  install-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install into throwaway workspaces and verify
        run: python tests/install_regression.py --verbose
